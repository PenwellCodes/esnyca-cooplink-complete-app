<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Esnyca App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .back-button {
            position: absolute;
            left: 20px;
            top: 20px;
            background: none;
            border: none;
            font-size: 24px;
            color: #667eea;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .back-button:hover {
            background-color: rgba(102, 126, 234, 0.1);
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .input-container {
            position: relative;
            margin-bottom: 20px;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 20px;
        }

        .input-field {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s;
            background: #f8f9fa;
        }

        .input-field:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .reset-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .reset-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .reset-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .instructions {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                margin: 20px;
            }

            .title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-button" onclick="history.back()">&#8592;</button>

        <div class="header">
            <h1 class="title">Reset Password</h1>
            <p class="subtitle">Esnyca App</p>
        </div>

        <div id="mobile-notice" class="message success" style="display: none;">
            📱 For the best experience, please use the Esnyca mobile app to reset your password.
        </div>

        <div id="message" class="message" style="display: none;"></div>

        <p class="instructions">
            Enter your email address and we'll send you a link to reset your Esnyca App password.
        </p>

        <div class="form-group">
            <div class="input-container">
                <span class="input-icon">📧</span>
                <input
                    type="email"
                    id="email"
                    class="input-field"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <button id="resetButton" class="reset-button" onclick="handleReset()">
                Send Reset Link
            </button>
        </div>
    </div>

    <script>
        let isLoading = false;

        function showMessage(message, type = 'success') {
            const messageEl = document.getElementById('message');
            messageEl.textContent = message;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';

            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        }

        function setLoading(loading) {
            isLoading = loading;
            const button = document.getElementById('resetButton');
            const emailInput = document.getElementById('email');

            if (loading) {
                button.innerHTML = '<span class="loading"></span> Sending...';
                button.disabled = true;
                emailInput.disabled = true;
            } else {
                button.innerHTML = 'Send Reset Link';
                button.disabled = false;
                emailInput.disabled = false;
            }
        }

        async function handleReset() {
            if (isLoading) return;

            const email = document.getElementById('email').value.trim();

            if (!email) {
                showMessage('Please enter your email address', 'error');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showMessage('Please enter a valid email address', 'error');
                return;
            }

            setLoading(true);

            try {
                const response = await fetch('/api/auth/forgot-password/email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email.toLowerCase() })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    showMessage('Reset email sent! Check your inbox for the link to reset your Esnyca App password.', 'success');
                    document.getElementById('email').value = '';
                } else {
                    showMessage(data.message || 'Failed to send reset email. Please try again.', 'error');
                }
            } catch (error) {
                console.error('Reset error:', error);
                showMessage('Network error. Please check your connection and try again.', 'error');
            } finally {
                setLoading(false);
            }
        }

        // Handle Enter key
        document.getElementById('email').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleReset();
            }
        });

        // Focus email input on load
        window.addEventListener('load', function() {
            document.getElementById('email').focus();

            // Show mobile notice on mobile devices
            if (window.innerWidth <= 768 || /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                document.getElementById('mobile-notice').style.display = 'block';
            }
        });
    </script>
</body>
</html>
